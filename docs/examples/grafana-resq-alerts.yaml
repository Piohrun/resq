# Generated by tools/render_ingestion_assets.py; do not edit by hand.
# Example Grafana alert provisioning over the resQ ingestion schema.
# Requires a PostgreSQL datasource with uid resq-sql. Thresholds are
# deliberately conservative starting points, not policy.
apiVersion: 1
groups:
  - orgId: 1
    name: resq-evidence
    folder: resQ
    interval: 5m
    rules:
      - uid: resq-pass-rate
        title: resQ pass rate below 95 percent
        condition: threshold
        for: 0m
        annotations:
          summary: Latest matching run passed fewer than 95% of executed tests.
        data:
          - refId: pass_rate
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: resq-sql
            model:
              format: time_series
              rawSql: |
                SELECT r.finished_at AS time,
                       CASE WHEN r.test_count = 0 THEN 100.0 ELSE 100.0 * r.pass_count / r.test_count END AS pass_rate
                FROM resq_runs AS r WHERE ('' = '' OR r.service = '') AND ('' = '' OR r.environment = '') AND ('' = '' OR r.vcs_branch = '') AND $__timeFilter(r.finished_at)
                ORDER BY r.finished_at
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: pass_rate
              reducer: last
              conditions:
                - evaluator: {type: lt, params: [95]}
      - uid: resq-benchmark-regressed
        title: resQ benchmark regression detected
        condition: threshold
        for: 0m
        annotations:
          summary: The statistical benchmark gate classified at least one benchmark as regressed.
        data:
          - refId: verdicts
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: resq-sql
            model:
              format: time_series
              rawSql: |
                SELECT r.finished_at AS time,
                       SUM(CASE WHEN b.comparison_class = 'regressed' THEN 1 ELSE 0 END) AS regressed,
                       SUM(CASE WHEN b.comparison_class = 'inconclusive' THEN 1 ELSE 0 END) AS inconclusive,
                       SUM(CASE WHEN b.comparison_class = 'improved' THEN 1 ELSE 0 END) AS improved,
                       SUM(CASE WHEN b.comparison_class = 'stable' THEN 1 ELSE 0 END) AS stable
                FROM resq_benchmarks AS b JOIN resq_runs AS r ON r.run_id = b.run_id
                WHERE ('' = '' OR r.service = '') AND ('' = '' OR r.environment = '') AND ('' = '' OR r.vcs_branch = '') AND $__timeFilter(r.finished_at)
                GROUP BY r.finished_at ORDER BY r.finished_at
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: verdicts
              reducer: last
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: resq-quarantine-debt
        title: resQ active quarantine debt
        condition: threshold
        for: 0m
        annotations:
          summary: At least one test is running under an active quarantine.
        data:
          - refId: debt
            relativeTimeRange: {from: 604800, to: 0}
            datasourceUid: resq-sql
            model:
              format: time_series
              rawSql: |
                SELECT r.finished_at AS time,
                       (SELECT COUNT(*) FROM resq_tests AS t
                         WHERE t.run_id = r.run_id AND t.quarantine_active) AS active_quarantines,
                       (SELECT COUNT(*) FROM resq_tests AS t
                         WHERE t.run_id = r.run_id AND t.retried) AS retried_tests
                FROM resq_runs AS r WHERE ('' = '' OR r.service = '') AND ('' = '' OR r.environment = '') AND ('' = '' OR r.vcs_branch = '') AND $__timeFilter(r.finished_at)
                ORDER BY r.finished_at
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: debt
              reducer: last
              conditions:
                - evaluator: {type: gt, params: [0]}
