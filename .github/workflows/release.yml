name: Release gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-gate:
    if: ${{ vars.RESQ_KDB_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: tools/verify_static.py --expected-tag "${GITHUB_REF_NAME}"

      - name: Verify release candidate
        shell: bash
        run: tools/verify_release_gate.py --q q --out-dir artifacts/release-audit

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resq-release-audit-${{ github.run_id }}
          path: artifacts/release-audit/
          if-no-files-found: error
          retention-days: 90
