name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence-free:
    name: Licence-free contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resq
          POSTGRES_PASSWORD: resq
          POSTGRES_DB: resq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resq -d resq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Package, shell, schema, docs, and Python contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/licence-free
          {
            bash -n bin/resq bin/qspec bin/resq-merge
            tools/verify_static.py
            tools/verify_python_contracts.py
          } 2>&1 | tee artifacts/licence-free/contracts.txt
      - name: Execute PostgreSQL ingestion contract
        shell: bash
        env:
          RESQ_POSTGRES_DSN: postgresql://resq:resq@127.0.0.1:5432/resq
        run: |
          set -euo pipefail
          python3 -m pip install 'psycopg[binary]>=3.1,<4'
          tools/verify_ingestion_contract.py \
            2>&1 | tee artifacts/licence-free/postgres-ingestion.txt
      - name: Upload licence-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-licence-free-${{ github.run_id }}
          path: artifacts/licence-free/
          if-no-files-found: error
          retention-days: 14

  correctness:
    name: Correctness (normal and isolated)
    needs: licence-free
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify licensed runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v q
          command -v timeout
          command -v mktemp
          command -v python3
          timeout --help | grep -q -- '--kill-after'
          q -q -e 1 </dev/null
      - name: Strict normal evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/correctness/state
          ./bin/resq test tests -strict -json -junit -quiet -report-profile full \
            -outDir artifacts/correctness/normal \
            -state-file artifacts/correctness/state/normal.json \
            -flake-history artifacts/correctness/state/normal-flake.json \
            -quarantine-file artifacts/correctness/state/normal-quarantine.json \
            -flake-proposal-file artifacts/correctness/state/normal-proposals.json \
            2>&1 | tee artifacts/correctness/normal-console.txt
      - name: Strict isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          ./bin/resq test tests -strict -isolate -isolateTimeout 90 \
            -isolateWorkers 4 -json -junit -quiet -report-profile full \
            -outDir artifacts/correctness/isolated \
            -state-file artifacts/correctness/state/isolated.json \
            -flake-history artifacts/correctness/state/isolated-flake.json \
            -quarantine-file artifacts/correctness/state/isolated-quarantine.json \
            -flake-proposal-file artifacts/correctness/state/isolated-proposals.json \
            2>&1 | tee artifacts/correctness/isolated-console.txt
      - name: Validate and reconcile correctness evidence
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          from validate_report import validate
          from verify_release_gate import reconcile_suites

          root = Path("artifacts/correctness")
          reports = {}
          for name in ("normal", "isolated"):
              report = json.loads((root / name / "test-results.json").read_text())
              validate(report)
              reports[name] = report
          reconcile_suites(reports["normal"], reports["isolated"], root / "parity.json")
          PY
      - name: Upload correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-correctness-${{ github.run_id }}
          path: artifacts/correctness/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage and correctness reconciliation
    needs: licence-free
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Produce reconciled coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tools/verify_coverage_contract.py --q q --out-dir artifacts/coverage-evidence \
            2>&1 | tee artifacts/coverage-console.txt
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-coverage-${{ github.run_id }}
          path: artifacts/coverage-*
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Native and pinned qspec compatibility
    needs: licence-free
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Produce compatibility evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tools/verify_qspec_compatibility.py --q q --out-dir artifacts/compatibility-evidence \
            2>&1 | tee artifacts/compatibility-console.txt
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-compatibility-${{ github.run_id }}
          path: artifacts/compatibility-*
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Fingerprinted benchmark contract
    needs: licence-free
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify workload/environment and regression policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/performance
          tools/verify_benchmark_regression.py 2>&1 | tee artifacts/performance/contract.txt
          tools/verify_coverage_performance.py --q q \
            2>&1 | tee artifacts/performance/coverage-hot-path.txt
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-performance-${{ github.run_id }}
          path: artifacts/performance/
          if-no-files-found: error
          retention-days: 14

  hostile-release:
    name: Hostile and release-protocol contracts
    needs: licence-free
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Exercise fail-closed operational boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/hostile-release
          {
            tools/verify_cli_terminal.py --q q
            tools/verify_execution_matrix.py --q q
            tools/verify_shard_merge.py --q q
            tools/verify_property_protocol.py --q q
            tools/verify_quarantine.py --q q
            tools/verify_snapshot_inventory.py --q q
            tools/verify_hostile_env.py --q q
            tools/verify_labels_context.py
            tools/verify_ingestion_contract.py
            tools/verify_external_pilots.py --q q
          } 2>&1 | tee artifacts/hostile-release/contracts.txt
      - name: Upload hostile/release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-hostile-release-${{ github.run_id }}
          path: artifacts/hostile-release/
          if-no-files-found: error
          retention-days: 14
