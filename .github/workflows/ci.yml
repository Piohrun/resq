name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Licence-free contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: bash -n bin/resq bin/qspec bin/resq-merge

      - name: Documentation, schema, XML, and package contracts
        run: tools/verify_static.py

      - name: Python adapter tests
        run: python3 -m unittest discover -s tools/tests -v

  verify:
    # kdb+/q requires a license-bound runtime. Attach a Linux x64 runner with
    # q on PATH and these labels; see docs/CI.md. Do not commit a license.
    runs-on: [self-hosted, linux, x64, kdb]
    needs: static
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v q
          command -v timeout
          command -v mktemp
          command -v python3
          timeout --help | grep -q -- '--kill-after'
          q -q -e 1 </dev/null

      - name: Strict suite
        shell: bash
        run: |
          ./bin/resq test tests -strict -junit -json \
            -outDir artifacts/normal

      - name: Supported execution matrix
        shell: bash
        run: tools/verify_execution_matrix.py --q q

      - name: Distributed shard merge matrix
        shell: bash
        run: tools/verify_shard_merge.py --q q

      - name: Property generator and shrink protocol
        shell: bash
        run: tools/verify_property_protocol.py --q q

      - name: Flake evidence and quarantine policy
        shell: bash
        run: tools/verify_quarantine.py --q q

      - name: Snapshot inventory and recoverable pruning
        shell: bash
        run: tools/verify_snapshot_inventory.py --q q

      - name: Benchmark regression baselines and telemetry
        shell: bash
        run: tools/verify_benchmark_regression.py

      - name: Hostile environment and interruption audit
        shell: bash
        run: tools/verify_hostile_env.py --q q

      - name: External adoption pilots
        shell: bash
        run: tools/verify_external_pilots.py --q q

      # -isolateWorkers exercises the concurrent path; its verdicts must match
      # the sequential "Strict suite" step above.
      - name: Strict isolated suite
        shell: bash
        run: |
          ./bin/resq test tests -strict -isolate -isolateTimeout 30 \
            -isolateWorkers 4 \
            -junit -json -outDir artifacts/isolate

      # Every independent denominator is complete before its threshold can pass.
      - name: Coverage gate
        shell: bash
        run: |
          ./bin/resq cover examples/quickstart/test -strict \
            --source examples/quickstart/src -cov-statements -cov-branches \
            -cov-min 70 -cov-lines-min 80 -cov-completeness-min 100 \
            -cov-branches-min 50 -cov-branch-completeness-min 100 \
            -junit -json -outDir artifacts/coverage

      - name: Validate machine-readable artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path("artifacts")
          expected = {
              root / mode / name
              for mode in ("normal", "isolate", "coverage")
              for name in ("test-results.junit.xml", "test-results.json")
          }
          missing = sorted(str(path) for path in expected if not path.is_file())
          if missing:
              raise SystemExit("missing report artifacts: " + ", ".join(missing))

          for path in root.rglob("*.xml"):
              ElementTree.parse(path)
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          for path in root.rglob("test-results.json"):
              import subprocess
              subprocess.run(
                  ["tools/validate_report.py", str(path)], check=True
              )

          coverage = json.loads(
              (root / "coverage" / "test-results.json").read_text(encoding="utf-8")
          )["coverage"]
          if coverage["basis"] != "functions":
              raise SystemExit(f"legacy gate must use functions: {coverage!r}")
          if coverage["functionsFound"] != 20:
              raise SystemExit(f"quickstart function inventory drifted: {coverage!r}")
          if coverage["linesFound"] != 59 or coverage["linesHit"] != 48:
              raise SystemExit(f"quickstart measured-line inventory drifted: {coverage!r}")
          if coverage["statementSitesFound"] != 72 or coverage["statementSitesHit"] != 51:
              raise SystemExit(f"quickstart statement-site inventory drifted: {coverage!r}")
          if coverage["branchesFound"] != 34 or coverage["branchesHit"] != 19:
              raise SystemExit(f"quickstart branch inventory drifted: {coverage!r}")
          if coverage["statementInstrumentationPercent"] != 100:
              raise SystemExit(f"statement instrumentation is incomplete: {coverage!r}")
          if coverage["branchInstrumentationPercent"] != 100:
              raise SystemExit(f"branch instrumentation is incomplete: {coverage!r}")
          if not coverage["passed"] or coverage["functionPercent"] < 70:
              raise SystemExit(f"coverage gate/report disagreement: {coverage!r}")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-ci-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
