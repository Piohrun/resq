name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Licence-free contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        shell: bash
        run: bash -n bin/resq bin/qspec bin/resq-merge

      - name: Documentation, schema, XML, and package contracts
        run: tools/verify_static.py

      - name: Python adapter tests
        run: python3 -m unittest discover -s tools/tests -v

  verify:
    # kdb+/q requires a license-bound runtime. Attach a Linux x64 runner with
    # q on PATH and these labels; see docs/CI.md. Do not commit a license.
    runs-on: [self-hosted, linux, x64, kdb]
    needs: static
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v q
          command -v timeout
          command -v mktemp
          command -v python3
          timeout --help | grep -q -- '--kill-after'
          q -q -e 1 </dev/null

      - name: Strict suite
        shell: bash
        run: |
          ./bin/resq test tests -strict -junit -json \
            -outDir artifacts/normal

      - name: Supported execution matrix
        shell: bash
        run: tools/verify_execution_matrix.py --q q

      - name: Distributed shard merge matrix
        shell: bash
        run: tools/verify_shard_merge.py --q q

      - name: Hostile environment and interruption audit
        shell: bash
        run: tools/verify_hostile_env.py --q q

      - name: External adoption pilots
        shell: bash
        run: tools/verify_external_pilots.py --q q

      # -isolateWorkers exercises the concurrent path; its verdicts must match
      # the sequential "Strict suite" step above.
      - name: Strict isolated suite
        shell: bash
        run: |
          ./bin/resq test tests -strict -isolate -isolateTimeout 30 \
            -isolateWorkers 4 \
            -junit -json -outDir artifacts/isolate

      # -cov-statements adds diagnostic line records. The legacy -cov-min gate
      # deliberately remains on the complete function inventory until line
      # instrumentation completeness has its own enforceable contract.
      - name: Coverage gate
        shell: bash
        run: |
          ./bin/resq cover examples/quickstart/test -strict -cov-statements \
            -cov-include '*/examples/quickstart/src/*' -cov-min 70 \
            -junit -json -outDir artifacts/coverage

      - name: Validate machine-readable artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path("artifacts")
          expected = {
              root / mode / name
              for mode in ("normal", "isolate", "coverage")
              for name in ("test-results.junit.xml", "test-results.json")
          }
          missing = sorted(str(path) for path in expected if not path.is_file())
          if missing:
              raise SystemExit("missing report artifacts: " + ", ".join(missing))

          for path in root.rglob("*.xml"):
              ElementTree.parse(path)
          for path in root.rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          for path in root.rglob("test-results.json"):
              import subprocess
              subprocess.run(
                  ["tools/validate_report.py", str(path)], check=True
              )

          coverage = json.loads(
              (root / "coverage" / "test-results.json").read_text(encoding="utf-8")
          )["coverage"]
          if coverage["basis"] != "functions":
              raise SystemExit(f"legacy gate must use functions: {coverage!r}")
          if coverage["functionsFound"] != 20:
              raise SystemExit(f"quickstart function inventory drifted: {coverage!r}")
          if coverage["linesFound"] != 17:
              raise SystemExit(f"quickstart measured-line inventory drifted: {coverage!r}")
          if not coverage["passed"] or coverage["functionPercent"] < 70:
              raise SystemExit(f"coverage gate/report disagreement: {coverage!r}")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-ci-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
