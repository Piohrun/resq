name: Nightly differential corpus

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      loader_seeds:
        description: Deterministic loader differential seeds
        required: false
        default: "400"
      coverage_seeds:
        description: Deterministic coverage differential seeds
        required: false
        default: "2000"

permissions:
  contents: read

concurrency:
  group: resq-nightly-differential
  cancel-in-progress: false

jobs:
  differential:
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 60
    env:
      RESQ_LOADER_DIFF_SEEDS: ${{ inputs.loader_seeds || '400' }}
      RESQ_COVERAGE_DIFF_SEEDS: ${{ inputs.coverage_seeds || '2000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v q
          command -v python3
          q -q -e 1 </dev/null

      - name: Extended differentials and compiler-boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/differential
          printf 'loaderSeeds=%s\ncoverageSeeds=%s\n' \
            "$RESQ_LOADER_DIFF_SEEDS" "$RESQ_COVERAGE_DIFF_SEEDS" \
            > artifacts/differential/corpus.txt
          ./bin/resq test tests/test_loader_differential.q \
            tests/test_coverage_differential.q \
            nightly/test_oversized_desc.q -strict -json \
            -outDir artifacts/differential
          tools/validate_report.py artifacts/differential/test-results.json

      - name: Optional independent resQ self-coverage
        if: ${{ vars.AXLIBRARIES_HOME != '' }}
        env:
          AXLIBRARIES_HOME: ${{ vars.AXLIBRARIES_HOME }}
        shell: bash
        run: |
          set -euo pipefail
          tools/run_self_coverage.py \
            --library "$AXLIBRARIES_HOME/ws/coverage.q_" \
            --output artifacts/self-coverage \
            --q q -- test tests -strict -quiet

      - name: Upload differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-nightly-differential-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  soak-scale:
    name: Repeated-process soak and 10k report scale
    runs-on: [self-hosted, linux, x64, kdb]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Repeated watch/no-exit resource trends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/soak-scale
          tools/verify_soak.py --q q --output artifacts/soak-scale/soak-evidence.json \
            2>&1 | tee artifacts/soak-scale/soak-console.txt
      - name: Green and failure-heavy report scale
        shell: bash
        run: |
          set -euo pipefail
          tools/verify_report_scale.py --q q --output artifacts/soak-scale/report-scale.json \
            2>&1 | tee artifacts/soak-scale/scale-console.txt
      - name: Upload soak/scale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resq-nightly-soak-scale-${{ github.run_id }}
          path: artifacts/soak-scale/
          if-no-files-found: error
          retention-days: 30
